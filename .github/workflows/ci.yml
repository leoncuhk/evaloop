name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -c "import ast; ast.parse(open('run.py').read())"
          python3 -c "import ast; ast.parse(open('core.py').read())"
      # CLAUDE.md states a size budget. A stated constraint nothing checks is
      # the same class of problem as a documented protection nothing wires in.
      - name: Size budget
        run: |
          python3 - <<'EOF'
          import sys
          budgets = {"run.py": 660, "core.py": 600}
          over = []
          for name, limit in budgets.items():
              n = sum(1 for _ in open(name))
              print(f"{name}: {n}/{limit}")
              if n > limit:
                  over.append(f"{name} is {n} lines, budget {limit}")
          if over:
              sys.exit("Size budget exceeded: " + "; ".join(over))
          EOF

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install numpy pandas
      - name: Unit tests
        run: python tests/test_run.py
      - name: Integration tests
        run: python tests/test_integration.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 run.py list-modes
      - run: python3 run.py status examples/quant-lab
      # End-to-end through the engine, including the integrity checks, at no cost.
      - name: Simulated loop
        run: |
          mkdir -p /tmp/sim/.state
          echo "hypothesis" > /tmp/sim/hypothesis.md
          cat > /tmp/sim/.state/sim_script.json <<'EOF'
          [{"state_changes": {"experiments": [{"id": "E1", "status": "pending"}],
                              "best_metric": 0.5, "target_metric": 1.5}, "cost": 0.01},
           {"state_changes": {"experiments": [{"id": "E1", "status": "accepted"}],
                              "best_metric": 1.9, "target_metric": 1.5}, "cost": 0.01}]
          EOF
          python3 run.py loop --simulate --pause 0 --max-sessions 5 /tmp/sim
      - name: Tamper detection fires end to end
        # The shipped demo, exactly as the README tells users to run it.
        run: |
          python3 run.py loop --simulate --pause 0 examples/tamper-demo \
            | tee /tmp/tamper.out
          grep -q "TAMPERED" /tmp/tamper.out
          grep -q "Those metrics are not results" /tmp/tamper.out
