# evaloop — the shipped loop
# Inductive: hypothesis → experiment → evaluate → learn → iterate.
# Copy this directory to define your own; the engine picks up any mode here.
description=Hypothesis-driven loop scored by a metric (hypothesis → experiment → evaluate → learn)
entry_file=hypothesis.md
state_file=journal.json

# Which array holds the work items, and which status values are legal in it.
# The engine validates written state against this — a mode that omits them is
# not validated, so declare them.
state_array=experiments
valid_statuses=pending,planned,running,accepted,rejected,error,baseline,kept

pending_query=[.experiments[] | select(.status == "pending" or .status == "planned" or .status == "running")] | length
progress_query=[.experiments[] | select(.status == "accepted" or .status == "rejected" or .status == "error")] | length
phase_init=theorizer
phase_work=executor
phase_review=analyst
phase_orient=strategist
agents_md=AGENTS.md

# Scoring. Keep hidden_verify_command in a sealed file outside the project
# instead, whenever the held-out number has to mean something.
verify_command=python3 run_backtest.py 2>/dev/null || python run_backtest.py
hidden_verify_command=python3 run_backtest.py --split test 2>/dev/null || python run_backtest.py --split test
metric_pattern=[Metric] Sharpe Ratio:
# A held-out point value must clear target + this margin. A scorer that prints
# [Sample] lines is judged on their lower confidence bound instead.
held_out_margin=0.0
# confirm_verify_command and hidden_data are read from the sealed file only.
